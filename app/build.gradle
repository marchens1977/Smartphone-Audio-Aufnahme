plugins {
    id 'com.android.application'
}

// Versionsnummer: kommt beim automatischen Bau von GitHub (fortlaufende Nummer N).
// App-Version "1.0.N" passt zum Release-Namen "app-v1.0.N" - so erkennt die Update-Suche neue Versionen.
def bauNummer = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'de.smartphone.aufnahme'
    compileSdk 34

    defaultConfig {
        applicationId 'de.smartphone.aufnahme'
        minSdk 29          // Android 10 - ab da kann man Medienaudio aufnehmen
        targetSdk 34
        versionCode bauNummer
        versionName "1.0.${bauNummer}"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Immer derselbe Schluessel: so lassen sich neue Versionen einfach drueberinstallieren
    signingConfigs {
        eigener {
            storeFile file('schluessel.keystore')
            storePassword 'aufnahme'
            keyAlias 'aufnahme'
            keyPassword 'aufnahme'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.eigener }
        release {
            signingConfig signingConfigs.eigener
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'junit:junit:4.13.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'   // echtes JSON fuer Tests ohne Handy
}
